<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS & Billing App - Fixed</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-field { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-danger { background: #dc3545; color: white; border: none; padding: 6px 10px; cursor: pointer; border-radius: 4px; }
        .btn-warning { background: #ffc107; color: #333; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #f8f9fa; }
        .right { text-align: right; }
        
        /* Dropdown Search Box Styles */
        .search-box-container { position: relative; }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #007bff;
            max-height: 150px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .search-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .search-item:hover { background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simple & Working POS System</h2>
    
    <!-- TABS -->
    <div style="margin-bottom: 20px; display: flex; gap: 10px;">
        <button class="btn" onclick="switchTab('billing')" id="tabBilling">Billing / Quotation</button>
        <button class="btn" onclick="switchTab('quotes')" id="tabQuotes" style="background: #17a2b8;">Saved Quotations (<span id="quoteCount">0</span>)</button>
    </div>

    <!-- BILLING PANEL -->
    <div id="billingPanel">
        <h3>Create Invoice or Quotation</h3>
        
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <input type="text" id="custName" class="input-field" placeholder="Customer Name">
            <input type="text" id="custPhone" class="input-field" placeholder="Customer Phone">
        </div>

        <table>
            <thead>
                <tr>
                    <th width="40%">Item Name (Type to search)</th>
                    <th>Price (₹)</th>
                    <th>Qty</th>
                    <th class="right">Total (₹)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="invoiceRows">
                <!-- Rows will be added here -->
            </tbody>
        </table>
        
        <button class="btn" onclick="addItemRow()" style="margin-top: 10px;">+ Add Item</button>

        <div style="margin-top: 20px; text-align: right; font-size: 18px;">
            <strong>Grand Total: ₹<span id="grandTotal">0.00</span></strong>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn" onclick="alert('Invoice Saved & Printed!')">Save & Print Invoice</button>
            <button class="btn-warning" onclick="saveAsQuotation()">Save as Quotation</button>
        </div>
    </div>

    <!-- QUOTATIONS PANEL -->
    <div id="quotesPanel" style="display: none;">
        <h3>Saved Quotations List</h3>
        <table>
            <thead>
                <tr>
                    <th>Quote ID</th>
                    <th>Customer</th>
                    <th>Total Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="quoteTableBody">
                <tr><td colspan="4" style="text-align: center;">No quotations saved yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Sample Inventory Items for Dropdown Search
    const inventory = [
        { name: "Wooden Center Table", price: 4500 },
        { name: "Mango Wood Chair", price: 1800 },
        { name: "Antique Bookshelf", price: 6200 },
        { name: "Wicker Storage Basket", price: 950 },
        { name: "Wooden Chess Game Set", price: 1200 }
    ];

    let quotations = [];

    // Switch Tabs Function
    function switchTab(tab) {
        if(tab === 'billing') {
            document.getElementById('billingPanel').style.display = 'block';
            document.getElementById('quotesPanel').style.display = 'none';
        } else {
            document.getElementById('billingPanel').style.display = 'none';
            document.getElementById('quotesPanel').style.display = 'block';
            renderQuotations();
        }
    }

    // Add Row to Invoice Table
    function addItemRow() {
        let tbody = document.getElementById('invoiceRows');
        let tr = document.createElement('tr');
        
        tr.innerHTML = `
            <td class="search-box-container">
                <input type="text" class="input-field itemName" placeholder="Type to search item..." autocomplete="off" oninput="searchItems(this)" style="margin:0;">
                <div class="search-results"></div>
            </td>
            <td><input type="number" class="input-field itemPrice" value="0" oninput="calculateTotal()" style="margin:0;"></td>
            <td><input type="number" class="input-field itemQty" value="1" min="1" oninput="calculateTotal()" style="margin:0;"></td>
            <td class="right itemTotal">0.00</td>
            <td><button class="btn-danger" onclick="this.closest('tr').remove(); calculateTotal();">X</button></td>
        `;
        tbody.appendChild(tr);
        calculateTotal();
    }

    // Item Search Logic (Dropdown)
    function searchItems(input) {
        let query = input.value.toLowerCase().trim();
        let resultsDiv = input.nextElementSibling;
        resultsDiv.innerHTML = '';

        if(query === '') {
            resultsDiv.style.display = 'none';
            return;
        }

        let filtered = inventory.filter(i => i.name.toLowerCase().includes(query));
        if(filtered.length === 0) {
            resultsDiv.style.display = 'none';
            return;
        }

        filtered.forEach(item => {
            let div = document.createElement('div');
            div.className = 'search-item';
            div.innerHTML = `<strong>${item.name}</strong> - ₹${item.price}`;
            
            div.onclick = function() {
                input.value = item.name;
                let tr = input.closest('tr');
                tr.querySelector('.itemPrice').value = item.price;
                resultsDiv.style.display = 'none';
                calculateTotal();
            };
            resultsDiv.appendChild(div);
        });
        resultsDiv.style.display = 'block';
    }

    // Close dropdown on outside click
    window.onclick = function(e) {
        if(!e.target.closest('.search-box-container')) {
            document.querySelectorAll('.search-results').forEach(el => el.style.display = 'none');
        }
    };

    // Calculate Total Amounts
    function calculateTotal() {
        let rows = document.querySelectorAll('#invoiceRows tr');
        let grandTotal = 0;

        rows.forEach(tr => {
            let price = parseFloat(tr.querySelector('.itemPrice').value) || 0;
            let qty = parseFloat(tr.querySelector('.itemQty').value) || 0;
            let total = price * qty;
            tr.querySelector('.itemTotal').innerText = total.toFixed(2);
            grandTotal += total;
        });

        document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
    }

    // Save Quotation Logic
    function saveAsQuotation() {
        let custName = document.getElementById('custName').value.trim() || "Cash Customer";
        let grandTotal = document.getElementById('grandTotal').innerText;
        let rows = document.querySelectorAll('#invoiceRows tr');

        if(rows.length === 0) {
            alert("Please add at least one item!");
            return;
        }

        let items = [];
        rows.forEach(tr => {
            items.push({
                name: tr.querySelector('.itemName').value,
                price: tr.querySelector('.itemPrice').value,
                qty: tr.querySelector('.itemQty').value,
                total: tr.querySelector('.itemTotal').innerText
            });
        });

        let quoteId = 'QT-' + Math.floor(1000 + Math.random() * 9000);
        quotations.push({ id: quoteId, customer: custName, total: grandTotal, items: items });
        
        document.getElementById('quoteCount').innerText = quotations.length;
        alert("Quotation saved successfully! Check 'Saved Quotations' tab.");
        
        // Reset form
        document.getElementById('invoiceRows').innerHTML = '';
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        calculateTotal();
        addItemRow();
    }

    // Render Quotations in Table
    function renderQuotations() {
        let tbody = document.getElementById('quoteTableBody');
        tbody.innerHTML = '';

        if(quotations.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">No quotations saved yet.</td></tr>`;
            return;
        }

        quotations.forEach((q, index) => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${q.id}</strong></td>
                    <td>${q.customer}</td>
                    <td>₹${q.total}</td>
                    <td>
                        <button class="btn" onclick="loadQuote(${index})" style="padding: 4px 8px; font-size: 12px;">Load / View</button>
                        <button class="btn-danger" onclick="deleteQuote(${index})" style="padding: 4px 8px; font-size: 12px;">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    // Load Quote Back to Billing
    function loadQuote(index) {
        let q = quotations[index];
        document.getElementById('custName').value = q.customer;
        
        let tbody = document.getElementById('invoiceRows');
        tbody.innerHTML = '';

        q.items.forEach(item => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="search-box-container">
                    <input type="text" class="input-field itemName" value="${item.name}" autocomplete="off" oninput="searchItems(this)" style="margin:0;">
                    <div class="search-results"></div>
                </td>
                <td><input type="number" class="input-field itemPrice" value="${item.price}" oninput="calculateTotal()" style="margin:0;"></td>
                <td><input type="number" class="input-field itemQty" value="${item.qty}" min="1" oninput="calculateTotal()" style="margin:0;"></td>
                <td class="right itemTotal">${item.total}</td>
                <td><button class="btn-danger" onclick="this.closest('tr').remove(); calculateTotal();">X</button></td>
            `;
            tbody.appendChild(tr);
        });

        calculateTotal();
        switchTab('billing');
        alert(`Quotation ${q.id} loaded into billing screen!`);
    }

    // Delete Quotation
    function deleteQuote(index) {
        quotations.splice(index, 1);
        document.getElementById('quoteCount').innerText = quotations.length;
        renderQuotations();
    }

    // Initialize with one blank row
    window.onload = function() {
        addItemRow();
    };
</script>

</body>
</html>
