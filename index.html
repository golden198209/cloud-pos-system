<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing & POS Software</title>
    <style>
        /* Clean styling without top extra lines */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f7fafc; color: #2d3748; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }
        /* Add your existing custom CSS styles here */
    </style>
</head>
<body>

<div class="container">
    <!-- Main Application UI Elements -->
    <div id="app">
        <!-- Customer Select Dropdown -->
        <div class="form-group">
            <label for="customerSelect">Select Customer:</label>
            <select id="customerSelect" class="form-control" onchange="loadCustomerDetails(this)">
                <option value="">-- Choose Customer --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="manualCustDetails">Customer Details:</label>
            <textarea id="manualCustDetails" class="form-control" rows="3" placeholder="Customer name, address, phone, GSTIN..."></textarea>
        </div>

        <!-- Barcode Scanner Input -->
        <div class="form-group">
            <label for="barcodeScanInput">Barcode Scanner / Product Search:</label>
            <input type="text" id="barcodeScanInput" class="form-control" placeholder="Scan barcode or type product name..." autocomplete="off">
        </div>

        <!-- Item Rows Container -->
        <table style="width:100%; border-collapse: collapse; margin-top: 15px;">
            <thead>
                <tr style="background: #edf2f7;">
                    <th style="padding:8px; border:1px solid #cbd5e0;">#</th>
                    <th style="padding:8px; border:1px solid #cbd5e0;">Item Name</th>
                    <th style="padding:8px; border:1px solid #cbd5e0;">Qty</th>
                    <th style="padding:8px; border:1px solid #cbd5e0;">Taxable</th>
                    <th style="padding:8px; border:1px solid #cbd5e0;">GST</th>
                    <th style="padding:8px; border:1px solid #cbd5e0;">Total</th>
                </tr>
            </thead>
            <tbody id="itemRows">
                <!-- Dynamic Item Rows -->
            </tbody>
        </table>

        <!-- Totals & Actions -->
        <div style="margin-top: 20px; text-align: right;">
            <h3>Grand Total: <span id="grandTotal">₹0.00</span></h3>
        </div>

        <!-- WhatsApp Integration Button -->
        <div style="margin-top: 15px;">
            <input type="text" id="wa-recipient" class="form-control" placeholder="Enter WhatsApp Mobile Number (10 digits)" style="margin-bottom: 8px; width: 300px; padding: 6px;">
            <br>
            <button type="button" class="btn-success" onclick="sendBillToWhatsApp()" style="background: #28a34b; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Send Invoice via WhatsApp</button>
        </div>
    </div>
</div>

<script>
    // Global data structures
    let customers = [];
    let inventory = [];
    let quotations = [];
    let invoices = [];
    let companies = [];

    // Fix 1: Customer details auto-load properly on selection
    function loadCustomerDetails(selectElem) {
        let selectedName = selectElem.value;
        let cust = customers.find(c => c.name === selectedName);
        let detailsField = document.getElementById('manualCustDetails');
        if (cust) {
            detailsField.value = `${cust.name}\n${cust.address || ''}\nPhone: ${cust.phone || ''}\nGSTIN: ${cust.gstin || ''}`;
        } else {
            detailsField.value = '';
        }
    }

    // Populate customer dropdown helper
    function populateCustomerDropdown() {
        let select = document.getElementById('customerSelect');
        if(!select) return;
        select.innerHTML = '<option value="">-- Choose Customer --</option>';
        customers.forEach(cust => {
            let opt = document.createElement('option');
            opt.value = cust.name;
            opt.textContent = cust.name + (cust.phone ? ` (${cust.phone})` : '');
            select.appendChild(opt);
        });
    }

    // Fix 2: Robust Barcode Scanner Handler
    document.addEventListener('DOMContentLoaded', () => {
        const barcodeInput = document.getElementById('barcodeScanInput');
        if (barcodeInput) {
            barcodeInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    let code = this.value.trim();
                    if (!code) return;
                    
                    let product = inventory.find(p => p.barcode === code || p.name.toLowerCase().includes(code.toLowerCase()));
                    if (product) {
                        addItemRowWithProduct(product);
                        this.value = '';
                    } else {
                        alert("Product not found with barcode/name: " + code);
                    }
                }
            });
        }
    });

    function addItemRowWithProduct(prod) {
        // Adds item row logic seamlessly
        let tbody = document.getElementById('itemRows');
        let tr = document.createElement('tr');
        let qty = 1;
        let price = prod.price || 0;
        let gst = prod.gst || 18;
        let total = qty * price;
        let taxable = total / (1 + (gst / 100));
        let taxVal = total - taxable;

        tr.innerHTML = `
            <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;">1</td>
            <td style="padding:8px; border:1px solid #cbd5e0; font-weight:600;"><input type="text" class="row-name" value="${prod.name || ''}" style="width:100%; border:none; background:transparent;"></td>
            <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;"><input type="number" class="row-qty" value="${qty}" style="width:50px; text-align:center;"></td>
            <td style="padding:8px; border:1px solid #cbd5e0; text-align:right;" class="row-taxable">${taxable.toFixed(2)}</td>
            <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;">${taxVal.toFixed(2)} (${gst}%)</td>
            <td style="padding:8px; border:1px solid #cbd5e0; text-align:right; font-weight:bold;" class="row-total">${total.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
        calculateTotals();
    }

    function addItemRow() {
        addItemRowWithProduct({ name: '', price: 0, gst: 18, stock: 10 });
    }

    function calculateTotals() {
        let grandTotalVal = 0;
        document.querySelectorAll('#itemRows tr').forEach(tr => {
            let qty = parseFloat(tr.querySelector('.row-qty')?.value) || 1;
            let price = parseFloat(tr.querySelector('.row-name')?.value) || 100; // fallback if needed
            // recalculate logic
        });
        document.getElementById('grandTotal').innerText = "₹" + grandTotalVal.toFixed(2);
    }

    // Fix 3: Quotation & item rendering logic (Cleaned, removing top extra lines)
    if(typeof dataObj !== 'undefined' && dataObj.items && dataObj.items.length > 0) {
        dataObj.items.forEach((item, i) => {
            let qty = parseFloat(item.qty) || 1;
            let price = parseFloat(item.price) || 0;
            let gstRate = parseFloat(item.gst) || 18;
            let totalAmt = parseFloat(item.total) || (qty * price);
            
            let taxableVal = totalAmt / (1 + (gstRate / 100));
            let taxVal = totalAmt - taxableVal;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;">${i + 1}</td>
                <td class="left" style="padding:8px; border:1px solid #cbd5e0; font-weight:600; color:#2d3748;">${item.name || ''}</td>
                <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;">${qty} PCS</td>
                <td style="padding:8px; border:1px solid #cbd5e0; text-align:right;">${ taxableVal.toFixed(2) }</td>
                <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;">${taxVal.toFixed(2)} (${gstRate}%)</td>
                <td class="right" style="padding:8px; border:1px solid #cbd5e0; text-align:right; font-weight:bold; color:#1a365d;">${totalAmt.toFixed(2)}</td>
            `;
            let itemsBody = document.getElementById('itemRows');
            if(itemsBody) itemsBody.appendChild(tr);
        });
    }

    function resetInvoiceForm() {
        let itemRows = document.getElementById('itemRows');
        if(itemRows) itemRows.innerHTML = '';
        addItemRow();
        calculateTotals();
    }

    // Fix 4: WhatsApp Cloud API Integration Function
    async function sendBillToWhatsApp() {
        let rawPhone = "";

        const recipientInput = document.getElementById("wa-recipient");
        if (recipientInput && recipientInput.value.trim() !== "") {
            rawPhone = recipientInput.value.trim();
        } 
        
        if (!rawPhone) {
            const allInputs = document.querySelectorAll('input[type="text"], input[type="tel"], input[type="number"]');
            for (let input of allInputs) {
                let val = input.value ? input.value.trim() : "";
                let cleanVal = val.replace(/\D/g, '');
                if (cleanVal.length >= 10) {
                    rawPhone = val;
                    break;
                }
            }
        }

        if (!rawPhone) {
            alert("Customer ka mobile number nahi mila! Kripya WhatsApp wale box mein number likhein.");
            return;
        }

        let recipientPhone = rawPhone.replace(/\D/g, '');
        if (recipientPhone.length === 10) {
            recipientPhone = "91" + recipientPhone;
        }

        const accessToken = "EAAYnwZAsX1ZCUBShY31GsAMM9HoQuwgnoiaYJPBxGuI2gEEHlVMrXk3mQnoyj0c59C7lPc2RxX07iWsdQSYPn6Sd5EitJGOSdCd1dneO6orKL6gaF5Pp2MkIscLHEGyAbJXC2kgdfjK10lyDkpxDfPD8cAaFEyFInq2K9aTYLI2i3OavluZBfP30kKxk7rtAO7LBzuJnGVrZCeY4V1IxKkIkQfuPZBEl8uz46ckQK9ZAHlaUgJeCMKj0Vv4F5S9hXCP1Lt9EsvQyDLZCjllQwszGAZDZD";
        const phoneNumberID = "1355541827643665";

        const invoiceNum = typeof invoiceNumber !== 'undefined' ? invoiceNumber : (document.getElementById('invoiceNumber')?.value || 'INV-001');
        const totalAmount = document.getElementById('grandTotal')?.innerText || '₹0.00';

        const url = `https://graph.facebook.com/v18.0/${phoneNumberID}/messages`;

        const payload = {
            messaging_product: "whatsapp",
            to: recipientPhone,
            type: "text",
            text: {
                body: `Hello! Your invoice (${invoiceNum}) amounting to ${totalAmount} has been generated successfully.`
            }
        };

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ` + accessToken,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                alert("Success! Invoice WhatsApp par bhej di gayi hai.");
            } else {
                alert("Error: " + (result.error?.message || "Message nahi ja saka."));
            }
        } catch (error) {
            alert("Network Error: " + error.message);
        }
    }
</script>
</body>
</html>
