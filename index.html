    function onRowProductSelected(inputElem) {
        let val = inputElem.value.trim();
        let prod = inventory.find(p => p.name.toLowerCase() === val.toLowerCase());
        if(prod) {
            let tr = inputElem.closest('tr');
            tr.querySelector('.row-barcode').value = prod.barcode || '';
            tr.querySelector('.row-hsn').value = prod.hsn || '';
            tr.querySelector('.row-price').value = prod.price || 0;
            let gstSelect = tr.querySelector('.row-gst');
            if(gstSelect) gstSelect.value = prod.gst || 18;
            calculateTotals();
        }
    }

    function addItemRow() {
        addItemRowWithProduct({ name: '', barcode: '', hsn: '', price: 0, gst: 18, qty: 1 });
    }

    function calculateTotals() {
        let priceModeInput = document.querySelector('input[name="priceMode"]:checked');
        let priceMode = priceModeInput ? priceModeInput.value : 'exclusive';
        let rows = document.querySelectorAll('#itemRows tr');
        let subTotal = 0;
        let grandTotal = 0;
        let taxMap = {};

        rows.forEach(tr => {
            let qty = parseFloat(tr.querySelector('.row-qty').value) || 0;
            let enteredPrice = parseFloat(tr.querySelector('.row-price').value) || 0;
            let gstRate = parseFloat(tr.querySelector('.row-gst').value) || 0;
            let hsn = tr.querySelector('.row-hsn').value.trim() || 'GENERAL';

            let taxable = 0;
            let gstAmt = 0;
            let totalLine = 0;

            if(priceMode === 'inclusive') {
                totalLine = enteredPrice * qty;
                taxable = totalLine / (1 + (gstRate / 100));
                gstAmt = totalLine - taxable;
            } else {
                taxable = enteredPrice * qty;
                gstAmt = taxable * (gstRate / 100);
                totalLine = taxable + gstAmt;
            }

            subTotal += taxable;
            grandTotal += totalLine;

            tr.querySelector('.row-gst-amt').innerText = gstAmt.toFixed(2);
            tr.querySelector('.row-total').innerText = totalLine.toFixed(2);

            if(!taxMap[hsn]) {
                taxMap[hsn] = { taxable: 0, cgstRate: gstRate / 2, cgstAmt: 0, sgstRate: gstRate / 2, sgstAmt: 0, totalTax: 0 };
            }
            taxMap[hsn].taxable += taxable;
            taxMap[hsn].cgstAmt += gstAmt / 2;
            taxMap[hsn].sgstAmt += gstAmt / 2;
            taxMap[hsn].totalTax += gstAmt;
        });

        document.getElementById('subTotal').innerText = subTotal.toFixed(2);
        document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
        document.getElementById('amountInWords').innerText = convertNumberToWords(Math.round(grandTotal));

        let received = parseFloat(document.getElementById('amtReceived').value) || 0;
        let balance = grandTotal - received;
        let balElem = document.getElementById('balanceAmount');
        balElem.innerText = balance.toFixed(2);
        balElem.style.color = balance > 0 ? '#b30000' : 'green';

        let taxBody = document.getElementById('taxSummaryRows');
        taxBody.innerHTML = '';
        for(let hsn in taxMap) {
            let t = taxMap[hsn];
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${hsn}</td>
                <td class="right">${t.taxable.toFixed(2)}</td>
                <td>${t.cgstRate}%</td>
                <td class="right">${t.cgstAmt.toFixed(2)}</td>
                <td>${t.sgstRate}%</td>
                <td class="right">${t.sgstAmt.toFixed(2)}</td>
                <td class="right">${t.totalTax.toFixed(2)}</td>
            `;
            taxBody.appendChild(tr);
        }
    }

    function convertNumberToWords(amount) {
        if(amount === 0) return "Zero Rupees Only";
        let words = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
        let tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

        function getWord(n) {
            if(n < 20) return words[n];
            return tens[Math.floor(n/10)] + (n%10 ? ' ' + words[n%10] : '');
        }

        let num = Math.floor(amount);
        let str = '';
        if(num >= 10000000) {
            str += getWord(Math.floor(num / 10000000)) + ' Crore ';
            num %= 10000000;
        }
        if(num >= 100000) {
            str += getWord(Math.floor(num / 100000)) + ' Lakh ';
            num %= 100000;
        }
        if(num >= 1000) {
            str += getWord(Math.floor(num / 1000)) + ' Thousand ';
            num %= 1000;
        }
        if(num >= 100) {
            str += getWord(Math.floor(num / 100)) + ' Hundred ';
            num %= 100;
        }
        if(num > 0) {
            str += getWord(num) + ' ';
        }
        return str.trim() + ' Rupees Only';
    }

    function saveAndPrintInvoice() {
        let invNo = document.getElementById('invNumber').value;
        let firmIdx = document.getElementById('activeFirmSelect').value;
        let firmName = companies[firmIdx] ? companies[firmIdx].name : "Firm";
        let custDetails = document.getElementById('manualCustDetails').value;
        let custName = custDetails.split('\n')[0] || "Cash Customer";
        let grandTotal = parseFloat(document.getElementById('grandTotal').innerText) || 0;
        let received = parseFloat(document.getElementById('amtReceived').value) || 0;
        let balance = parseFloat(document.getElementById('balanceAmount').innerText) || 0;
        let date = document.getElementById('invDate').value;

        let items = [];
        document.querySelectorAll('#itemRows tr').forEach(tr => {
            items.push({
                name: tr.querySelector('.row-name').value,
                barcode: tr.querySelector('.row-barcode').value,
                hsn: tr.querySelector('.row-hsn').value,
                qty: tr.querySelector('.row-qty').value,
                price: tr.querySelector('.row-price').value,
                gst: tr.querySelector('.row-gst').value,
                total: tr.querySelector('.row-total').innerText
            });
        });

        let invoiceRecord = {
            firm: firmName,
            invNumber: invNo,
            date: date,
            customer: custName,
            custDetails: custDetails,
            grandTotal: grandTotal,
            received: received,
            balance: balance,
            items: items,
            status: balance <= 0 ? 'Paid' : 'Pending'
        };

        invoices.push(invoiceRecord);
        syncToCloud();
        
        renderHistoryTable();
        window.print();
        setNextInvoiceNumber();
        resetInvoiceForm();
    }

    function saveQuotation() {
        let firmIdx = document.getElementById('activeFirmSelect').value;
        let firmName = companies[firmIdx] ? companies[firmIdx].name : "Firm";
        let custDetails = document.getElementById('manualCustDetails').value;
        let custName = custDetails.split('\n')[0] || "Cash Customer";
        let grandTotal = parseFloat(document.getElementById('grandTotal').innerText) || 0;
        let date = document.getElementById('invDate').value;
        let quotNo = "QT-" + Math.floor(1000 + Math.random() * 9000);

        let items = [];
        document.querySelectorAll('#itemRows tr').forEach(tr => {
            items.push({
                name: tr.querySelector('.row-name').value,
                barcode: tr.querySelector('.row-barcode').value,
                hsn: tr.querySelector('.row-hsn').value,
                qty: tr.querySelector('.row-qty').value,
                price: tr.querySelector('.row-price').value,
                gst: tr.querySelector('.row-gst').value,
                total: tr.querySelector('.row-total').innerText
            });
        });

        let quotationRecord = {
            firm: firmName,
            quotNumber: quotNo,
            date: date,
            customer: custName,
            custDetails: custDetails,
            grandTotal: grandTotal,
            items: items
        };

        quotations.push(quotationRecord);
        syncToCloud();
        alert("Quotation saved successfully! (No. " + quotNo + ")");
        renderQuotationTable();
    }

            let qTotal = (typeof q.grandTotal === 'number') ? q.grandTotal : 0;
            tr.innerHTML = `
                <td>${q.firm || ''}</td>
                <td>${q.quotNumber || ''}</td>
                <td>${q.date || ''}</td>
                <td>${q.customer || ''}</td>
                <td>${qTotal.toFixed(2)}</td>
                <td>
                    <button type="button" class="btn-warning print-quot-btn" style="padding:4px 8px; font-size:11px;">🖨️ Print</button>
                    <button type="button" class="btn-success load-quot-btn" style="padding:4px 8px; font-size:11px;">Load</button> 
                    <button type="button" class="btn-danger del-quot-btn" style="padding:4px 8px; font-size:11px;">Delete</button>
                </td>`;
            
            tr.querySelector('.print-quot-btn').addEventListener('click', () => printDocumentModal(q, 'QUOTATION', q.quotNumber, q.date));
            tr.querySelector('.load-quot-btn').addEventListener('click', () => loadQuotationToInvoice(idx));
            tr.querySelector('.del-quot-btn').addEventListener('click', () => deleteQuotation(idx));
            tbody.appendChild(tr);
        });
    }

    function renderHistoryTable() {

        invoices.forEach((inv, idx) => {
            let tr = document.createElement('tr');
            let totalVal = (typeof inv.grandTotal === 'number') ? inv.grandTotal : 0;
            tr.innerHTML = `
                <td>${inv.firm || ''}</td>
                <td>${inv.invNumber || ''}</td>
                <td>${inv.date || ''}</td>
                <td>${inv.customer || ''}</td>
                <td>${inv.status || ''}</td>
                <td>${totalVal.toFixed(2)}</td>
                <td>
                    <button type="button" class="btn-warning print-inv-btn" style="padding:4px 8px; font-size:11px;">📄 View / Print</button>
                    <button type="button" class="btn-danger del-inv-btn" style="padding:4px 8px; font-size:11px;">Delete</button>

            tr.querySelector('.print-inv-btn').addEventListener('click', () => printDocumentModal(inv, 'TAX INVOICE', inv.invNumber, inv.date));
            tr.querySelector('.del-inv-btn').addEventListener('click', () => deleteInvoice(idx));
            tbody.appendChild(tr);

    function printDocumentModal(dataObj, docType, docNo, docDate) {
        if(!dataObj) return;

        let firmObj = companies.find(c => c.name === dataObj.firm) || companies[0];

        document.getElementById('qPrintDocTitle').innerText = docType;
        document.getElementById('qPrintFirmName').innerText = dataObj.firm || '';
        document.getElementById('qPrintFirmDetails').innerHTML = `Address: ${firmObj.address || ''}<br>Phone: ${firmObj.phone || ''} | GSTIN: ${firmObj.gstin || ''} | PAN: DSYPB2229F`;
        
        let cDetails = dataObj.custDetails ? dataObj.custDetails.trim() : "";
        if(!cDetails || cDetails.toLowerCase() === 'cash customer') {
            document.getElementById('qPrintBillTo').innerHTML = `<b>CASH SALE</b><br>Place of Supply: Jammu & Kashmir`;
            document.getElementById('qPrintShipTo').innerHTML = `<b>CASH SALE</b><br>Place of Supply: Jammu & Kashmir`;
        } else {
            document.getElementById('qPrintBillTo').innerText = cDetails;
            document.getElementById('qPrintShipTo').innerText = cDetails;
        }

        document.getElementById('qPrintNoLabel').innerText = docType === 'QUOTATION' ? 'Quotation No:' : 'Invoice No:';
        document.getElementById('qPrintDateLabel').innerText = docType === 'QUOTATION' ? 'Quotation Date:' : 'Invoice Date:';
        document.getElementById('qPrintNum').innerText = docNo;
        document.getElementById('qPrintDate').innerText = docDate;
        
        if(docType === 'QUOTATION') {
            document.getElementById('qPrintExpiryContainer').style.display = 'block';
            let qDateObj = new Date(docDate || Date.now());
            qDateObj.setDate(qDateObj.getDate() + 7);
            document.getElementById('qPrintExpiryDate').innerText = qDateObj.toISOString().split('T')[0];
        } else {
            document.getElementById('qPrintExpiryContainer').style.display = 'none';
        }

        document.getElementById('qPrintSignFirmText').innerText = `For ${dataObj.firm || 'Firm'}`;
        document.getElementById('qPrintBankDetails').innerHTML = `Name: <b>${firmObj.bankName || 'Jammu and Kashmir Bank'}</b><br>IFSC Code: <b>${firmObj.ifsc || 'N/A'}</b><br>Account No: <b>${firmObj.accNo || 'N/A'}</b>`;

        let itemsBody = document.getElementById('qPrintItemsBody');
        itemsBody.innerHTML = '';
        
        let taxSummaryMap = {};
        let totalItemsQty = 0;
        let totalTaxableVal = 0;
        let grandTotalVal = 0;

        if(dataObj.items && dataObj.items.length > 0) {
            dataObj.items.forEach((item, i) => {
                let qty = parseFloat(item.qty) || 1;
                let price = parseFloat(item.price) || 0;
                let gstRate = parseFloat(item.gst) || 18;
                let totalAmt = parseFloat(item.total) || (qty * price);
                
                totalItemsQty += qty;
                grandTotalVal += totalAmt;

                let taxableVal = totalAmt / (1 + (gstRate / 100));
                let taxVal = totalAmt - taxableVal;
                totalTaxableVal += taxableVal;

                let hsn = item.hsn || '9403';
                if(!taxSummaryMap[hsn]) {
                    taxSummaryMap[hsn] = { taxable: 0, taxAmt: 0 };
                }
                taxSummaryMap[hsn].taxable += taxableVal;
                taxSummaryMap[hsn].taxAmt += taxVal;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;">${i + 1}</td>
                    <td class="left" style="padding:8px; border:1px solid #cbd5e0; font-weight:600; color:#2d3748;">${item.name || ''}</td>
                    <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;">${qty} PCS</td>
                    <td style="padding:8px; border:1px solid #cbd5e0; text-align:right;">${ taxableVal.toFixed(2) }</td>
                    <td style="padding:8px; border:1px solid #cbd5e0; text-align:center;">${taxVal.toFixed(2)} (${gstRate}%)</td>
                    <td class="right" style="padding:8px; border:1px solid #cbd5e0; text-align:right; font-weight:bold; color:#1a365d;">${totalAmt.toFixed(2)}</td>
                `;
                itemsBody.appendChild(tr);
            });
        }

        document.getElementById('qPrintTableTotalQty').innerText = totalItemsQty;
        document.getElementById('qPrintTableTotalAmt').innerText = "₹" + grandTotalVal.toFixed(2);

        let taxSummaryBody = document.getElementById('qPrintTaxSummary');
        taxSummaryBody.innerHTML = '';
        for(let hsn in taxSummaryMap) {
            let t = taxSummaryMap[hsn];
            let cgst = t.taxAmt / 2;
            let sgst = t.taxAmt / 2;
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="padding:6px; border:1px solid #cbd5e0;">${hsn}</td>
                <td style="padding:6px; border:1px solid #cbd5e0; text-align:right;">${t.taxable.toFixed(2)}</td>
                <td style="padding:6px; border:1px solid #cbd5e0; text-align:center;">9%</td>
                <td style="padding:6px; border:1px solid #cbd5e0; text-align:right;">${cgst.toFixed(2)}</td>
                <td style="padding:6px; border:1px solid #cbd5e0; text-align:center;">9%</td>
                <td style="padding:6px; border:1px solid #cbd5e0; text-align:right;">${sgst.toFixed(2)}</td>
                <td style="padding:6px; border:1px solid #cbd5e0; text-align:right; font-weight:bold;">${t.taxAmt.toFixed(2)}</td>
            `;
            taxSummaryBody.appendChild(tr);
        }

        document.getElementById('qPrintAmountWords').innerText = convertNumberToWords(Math.round(grandTotalVal));
        document.getElementById('quotationPrintModal').style.display = 'flex';
    }

    function printQuotationPreview(idx) {
        let q = quotations[idx];
        if(!q) return;
        printDocumentModal(q, 'QUOTATION', q.quotNumber, q.date);
    }

    function loadQuotationToInvoice(idx) {
        let q = quotations[idx];
        if(!q) return;
        document.getElementById('manualCustDetails').value = q.custDetails || '';
        let tbody = document.getElementById('itemRows');
        tbody.innerHTML = '';
        if(q.items && q.items.length > 0) {
            q.items.forEach(item => {
                addItemRowWithProduct({
                    name: item.name,
                    barcode: item.barcode,
                    hsn: item.hsn,
                    price: parseFloat(item.price) || 0,
                    gst: parseFloat(item.gst) || 18,
                    qty: parseFloat(item.qty) || 1
                });
            });
        } else {
            addItemRow();
        }
        calculateTotals();
        switchTab('invoice', { currentTarget: document.querySelector('.nav-tabs button') });
        alert("Quotation loaded into New Bill screen!");
    }

    function deleteQuotation(idx) {
        quotations.splice(idx, 1);
        syncToCloud();
        renderQuotationTable();
    }

    function resetInvoiceForm() {
        document.getElementById('itemRows').innerHTML = '';

        document.getElementById('amtReceived').value = 0;

        setNextInvoiceNumber();
    }

    function openThermalReceipt() {
        let firmIdx = document.getElementById('activeFirmSelect').value;
        let firm = companies[firmIdx] || {};
        let custDetails = document.getElementById('manualCustDetails').value;
        let grandTotal = document.getElementById('grandTotal').innerText;
        let invNo = document.getElementById('invNumber').value;
        let date = document.getElementById('invDate').value;

        let receiptText = `================================\n`;
        receiptText += `      ${firm.name || 'POS RECEIPT'}\n`;
        receiptText += `  ${firm.address || ''}\n`;
        receiptText += `  Ph: ${firm.phone || ''} | GSTIN: ${firm.gstin || ''}\n`;
        receiptText += `================================\n`;
        receiptText += `Inv No: ${invNo} | Date: ${date}\n`;
        receiptText += `--------------------------------\n`;
        receiptText += `Bill To:\n${custDetails}\n`;
        receiptText += `--------------------------------\n`;
        receiptText += `Item            Qty   Price   Total\n`;
        receiptText += `--------------------------------\n`;

        document.querySelectorAll('#itemRows tr').forEach(tr => {
            let name = (tr.querySelector('.row-name').value || '').substring(0, 14).padEnd(14, ' ');
            let qty = (tr.querySelector('.row-qty').value || '').padStart(4, ' ');
            let price = (tr.querySelector('.row-price').value || '').padStart(7, ' ');
            let tot = (tr.querySelector('.row-total').innerText || '').padStart(7, ' ');
            receiptText += `${name} ${qty} ${price} ${tot}\n`;
        });

        receiptText += `--------------------------------\n`;
        receiptText += `GRAND TOTAL: Rs. ${grandTotal}\n`;
        receiptText += `================================\n`;
        receiptText += `       Thank You For Visit!      \n`;
        receiptText += `================================\n`;

        document.getElementById('thermalContent').innerText = receiptText;
        document.getElementById('thermalReceiptModal').style.display = 'flex';
    }

    function renderLedgerTable() {
        let tbody = document.getElementById('ledgerTableBody');
        tbody.innerHTML = '';
        invoices.filter(i => i.balance > 0).forEach((inv, idx) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${inv.customer}<br><small>${inv.custDetails}</small></td><td>${inv.invNumber}</td><td style="color:red; font-weight:bold;">${inv.balance.toFixed(2)}</td><td><button type="button" class="btn-success mark-paid-btn">Mark Paid</button></td>`;
            tr.querySelector('.mark-paid-btn').addEventListener('click', () => markInvoicePaid(inv.invNumber));
            tbody.appendChild(tr);
        });
    }

    function markInvoicePaid(invNo) {
        let inv = invoices.find(i => i.invNumber === invNo);
        if(inv) {
            inv.received = inv.grandTotal;
            inv.balance = 0;
            inv.status = 'Paid';
            syncToCloud();
            renderLedgerTable();
            updateReports();
        }
    }

    function updateReports() {
        let totalSales = 0;
        let totalReceived = 0;
        let totalPending = 0;
        let dayBookBody = document.getElementById('dayBookTableBody');
        dayBookBody.innerHTML = '';

        invoices.forEach(inv => {
            let gTotal = (typeof inv.grandTotal === 'number') ? inv.grandTotal : 0;
            let rec = (typeof inv.received === 'number') ? inv.received : 0;
            let bal = (typeof inv.balance === 'number') ? inv.balance : 0;

            totalSales += gTotal;
            totalReceived += rec;
            totalPending += bal;

            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${inv.date || ''}</td><td>${inv.invNumber || ''}</td><td>${inv.customer || ''}</td><td>${gTotal.toFixed(2)}</td><td>${inv.status || ''}</td>`;
            dayBookBody.appendChild(tr);
        });

        document.getElementById('repTotalSales').innerText = `₹${totalSales.toFixed(2)}`;
        document.getElementById('repTotalReceived').innerText = `₹${totalReceived.toFixed(2)}`;
        document.getElementById('repTotalPending').innerText = `₹${totalPending.toFixed(2)}`;

        let gstrBody = document.getElementById('gstr1TableBody');
        gstrBody.innerHTML = '';
        let dummyTaxable = totalSales / 1.18;
        let dummyCgst = (totalSales - dummyTaxable) / 2;
        let dummySgst = dummyCgst;
        
        if(invoices.length > 0) {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>9403</td><td>${dummyTaxable.toFixed(2)}</td><td>${dummyCgst.toFixed(2)}</td><td>${dummySgst.toFixed(2)}</td><td>${(dummyCgst+dummySgst).toFixed(2)}</td>`;
            gstrBody.appendChild(tr);
        }
    }
