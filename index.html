<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Star POS - Billbook.space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Theme 1: Modern Indigo */
        .theme-indigo { --primary: #4f46e5; --bg-card: #e0e7ff; --text-main: #312e81; }
        /* Theme 2: Vibrant Emerald */
        .theme-emerald { --primary: #059669; --bg-card: #d1fae5; --text-main: #065f46; }
        /* Theme 3: Dark Luxe */
        .theme-dark { --primary: #1f2937; --bg-card: #374151; --text-main: #f9fafb; }
        /* Theme 4: Classic Corporate */
        .theme-corporate { --primary: #b45309; --bg-card: #fef3c7; --text-main: #78350f; }
        
        .custom-card { background-color: var(--bg-card); color: var(--text-main); }
    </style>
</head>
<body class="bg-gray-100 font-sans theme-indigo" id="appBody">

    <!-- Top Navigation / Theme Selector Bar -->
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">Golden Star POS (Billbook.space)</h1>
        
        <!-- Bill Design / Theme Switcher Option -->
        <div class="flex items-center space-x-3">
            <label for="themeSelector" class="text-sm font-medium text-gray-600">Choose Bill Design:</label>
            <select id="themeSelector" onchange="changeBillTheme(this.value)" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="theme-indigo">Modern Indigo</option>
                <option value="theme-emerald">Vibrant Emerald</option>
                <option value="theme-dark">Dark Luxe</option>
                <option value="theme-corporate">Classic Corporate</option>
            </select>
        </div>
    </header>

    <!-- Main Dashboard Layout -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Billing Form / Input Section -->
        <div class="md:col-span-1 bg-white p-5 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">New AI Billing</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Customer Name</label>
                    <input type="text" id="custName" placeholder="Enter customer name" class="w-full mt-1 border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Item Name & Price</label>
                    <input type="text" id="itemName" placeholder="e.g., Wooden Center Table - 4500" class="w-full mt-1 border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="generateBill()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Add & Print Bill</button>
            </div>
        </div>

        <!-- Dynamic Bill Preview Section -->
        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Live Bill Preview</h2>
            
            <!-- Bill Template Container -->
            <div id="billTemplateBox" class="custom-card p-6 rounded-xl border border-dashed border-gray-300 transition-all duration-300">
                <div class="flex justify-between border-b pb-4 mb-4">
                    <div>
                        <h3 class="font-bold text-xl">Golden Star Furniture & Interior</h3>
                        <p class="text-xs opacity-80">Custom Woodwork & Decor Solutions</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-semibold">Bill No: #GS-1001</p>
                        <p class="text-xs opacity-80">Date: 26-Sep-2026</p>
                    </div>
                </div>
                
                <div class="mb-4">
                    <p class="text-sm"><strong>Customer:</strong> <span id="previewCustomer">Walk-in Customer</span></p>
                </div>

                <table class="w-full text-left text-sm mb-4">
                    <thead>
                        <tr class="border-b opacity-80">
                            <th class="py-2">Item Description</th>
                            <th class="py-2 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="py-2" id="previewItem">Sample Wooden Product</td>
                            <td class="py-2 text-right">₹4,500.00</td>
                        </tr>
                    </tbody>
                </table>

                <div class="border-t pt-4 flex justify-between font-bold text-lg">
                    <span>Total Payable:</span>
                    <span>₹4,500.00</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Function to switch between bill designs dynamically without disturbing existing code
        function changeBillTheme(themeClass) {
            const body = document.getElementById('appBody');
            // Remove previous themes and apply the selected one
            body.className = `bg-gray-100 font-sans ${themeClass}`;
        }

        // Simple function to update preview text dynamically
        function generateBill() {
            const name = document.getElementById('custName').value;
            const item = document.getElementById('itemName').value;
            
            if(name) document.getElementById('previewCustomer').innerText = name;
            if(item) document.getElementById('previewItem').innerText = item;
        }
    </script>
</body>
</html>
